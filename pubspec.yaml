name: differentworld
description: "Different World — offline-first classroom planning & logging for early-childhood program staff."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  # Used in main.dart to opt into path-based web URLs (instead of
  # hash-fragment URLs). Ships with the Flutter SDK; declared
  # explicitly so the analyzer accepts the import.
  flutter_web_plugins:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State
  flutter_riverpod: ^3.3.1

  # Backend & sync
  supabase_flutter: ^2.12.4
  powersync: ^2.1.0

  # Local DB
  drift: ^2.33.0
  drift_sqlite_async: ^0.3.0
  sqlite_async: ^0.14.1

  # Routing
  go_router: ^17.2.3

  # Models / serialization
  freezed_annotation: ^3.1.0
  json_annotation: ^4.11.0

  # Utilities
  flutter_dotenv: ^6.0.1
  uuid: ^4.5.3
  path_provider: ^2.1.5
  path: ^1.9.1
  share_plus: ^11.0.0
  qr_flutter: ^4.1.0
  # In-app QR scanner — backup path for the OS deep link in case the
  # OS hands the URL off to the wrong handler. Used by the vehicles
  # list "Scan" button (Wave 82).
  mobile_scanner: ^7.1.3
  app_links: ^6.4.1
  intl: ^0.20.2

  # Photo capture + display
  image_picker: ^1.1.2
  image: ^4.5.4
  cached_network_image: ^3.4.1
  # Direct dep (already transitive via cached_network_image) — the full-screen
  # PhotoViewer's Share reads the cached image file via DefaultCacheManager.
  flutter_cache_manager: ^3.4.1
  # Wave 117: drag-and-drop file targets on desktop / web. The
  # image_picker library handles the file PICKER UX; this adds a
  # native drop zone so a teacher can drag a photo straight from
  # their desktop into the observation form. No-op on mobile (no
  # OS-level drag source).
  desktop_drop: ^0.7.1

  # Wave 120: audio playback for the survey TTS (Aura 2). Picks
  # up MP3 bytes from the local cache (or the Supabase signed URL
  # on first fetch) and plays them. just_audio handles every
  # platform (iOS / Android / macOS / Windows / Linux / web).
  just_audio: ^0.10.4
  # path_provider already declared above — reused for the TTS
  # cache directory at ${appDocs}/tts/{voice}/{question_id}.mp3.

  # On-device TTS for the Action Words kid voiceover — speaks each verb
  # aloud for pre-readers (the 4–6 cohort can't read "Carry / Listen").
  # Uses the platform speech engine, so it's offline-first: no network and
  # no bundled audio, unlike the Aura 2 survey path above (server MP3s).
  flutter_tts: ^4.0.0

  # Stream composition (already a transitive via PowerSync; declare it
  # explicitly because we use Rx.combineLatest in groups_providers).
  rxdart: ^0.28.0
  camera: ^0.12.0+1
  pdf: ^3.12.0
  printing: ^5.14.3
  url_launcher: ^6.3.2

  # Voice → text via Deepgram. `record` captures the mic stream;
  # `web_socket_channel` streams PCM chunks to Deepgram's live
  # endpoint and receives partial / final transcripts back.
  record: ^6.2.0
  web_socket_channel: ^3.0.3
  # Browser Fullscreen API for the present surfaces on web (lib/shared/platform/
  # fullscreen_web.dart). Native uses SystemChrome.immersiveSticky instead.
  web: ^1.1.1
  # Masonry (varied-size) gallery for the per-child day hub.
  flutter_staggered_grid_view: ^0.7.0
  permission_handler: ^12.0.1

  # Crash + error reporting. SENTRY_DSN in .env enables; without it,
  # the init no-ops and errors stay local (FlutterError.reportError
  # still prints in debug, just doesn't ship anywhere). See docs/
  # SECRETS.md for the spend-cap + scrubbing posture.
  sentry_flutter: ^9.6.0

  # Connectivity changes — drives the photo upload queue's auto-
  # retry. When wifi or cellular returns, we drain the queue.
  connectivity_plus: ^7.0.0
  super_clipboard: ^0.9.1
  # Runtime use: settings prefs (text scale, outdoor mode) + Speak history.
  shared_preferences: ^2.5.3
  # Keep the screen awake during a cast presentation (the Receiver + cockpit
  # never sleep mid-session). All platforms (web uses the Screen Wake Lock API).
  wakelock_plus: ^1.2.8
  google_fonts: ^8.1.0

  # Field-trip maps + location (Wave: field-trip foundation). The trip
  # map is an EMBEDDED OpenStreetMap — free, no API key, no per-tile
  # billing — rendered by flutter_map over OSM raster tiles.
  #   flutter_map — the map widget (OSM tile layer + markers).
  #   latlong2    — the LatLng type flutter_map + geocoding speak.
  #   geolocator  — device GPS for the live "we are here" pin (works
  #                 offline; the fix comes from the GPS chip, not network).
  #   geocoding   — address → coordinates via the ON-DEVICE platform
  #                 geocoder (Android Geocoder / iOS CLGeocoder). No API
  #                 key; may need network, so callers handle a null result.
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.2
  geocoding: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Drives end-to-end navigation tests on a real device. Run via
  # `flutter test integration_test/` against a connected Pixel or
  # simulator; each test boots the actual MaterialApp and walks
  # through routes.
  integration_test:
    sdk: flutter

  build_runner: ^2.15.0
  drift_dev: ^2.33.0
  freezed: ^3.2.5
  json_serializable: ^6.13.2
  very_good_analysis: ^10.2.0

  # Brand-face generators — run once after the Horizon mark changes
  # (the source PNG is built by tool/render_brand_assets.dart):
  #   dart run flutter_launcher_icons
  #   dart run flutter_native_splash:create
  flutter_launcher_icons: ^0.14.0
  flutter_native_splash: ^2.4.0

flutter:
  uses-material-design: true

  assets:
    - .env
    # The 10-week "If You Built a World" curriculum (bundled JSON so the
    # worlds load offline). Source of truth: docs/curriculum/.
    - assets/curriculum/ten_worlds.json
    # Big Thinking — play → name → bridge → question games.
    - assets/curriculum/thinking_games.json
    # 30 "spell words" — beautiful words a kid earns by using 3× (the daily
    # word + the printed gold word-cards).
    - assets/curriculum/spell_words.json
    # The staff runbook — every moment of the day in three lanes
    # (lead / helper / if-it-breaks). The adult twin of "Play today".
    - assets/curriculum/staff_runbook.json
    # Verb roles — each of the 12 verbs as a kid JOB (+ helper script +
    # 3-level mission) and a 3-level STAFF skill. One spine, three lives.
    - assets/curriculum/verb_roles.json
    # The staff growth ladder — Shadow → Extra Hands → Co-Pilot → Conductor,
    # with can-do / not-yet. Mirrors the kid's own character arc.
    - assets/curriculum/staff_roles.json
    # The 50-day journey — ten WEEKLY worlds (aligned 1:1 with ten_worlds.json:
    # Me / Stories / Nature / Water / Music / Space / Dreams / Time / Feelings /
    # Us), each with its environment (arrival / room / soundtrack), wall-question
    # bank, spell-words, key moment, and five authored days (title + focus). The
    # lived experience above the verb catalog.
    - assets/curriculum/world_blocks.json
    # The per-weekly-world MISSIONS (daily / weekly / project) + RPG progression
    # (avatar evolution, spells, tools, inventory, allies, lore, weather) — the
    # kid-as-player layer, keyed 1:1 with the 10 weekly worlds.
    - assets/curriculum/world_arc.json
    # Card-game decks — label-free picture cards + a manifest.json per deck
    # (docs/CARD_GAMES.md). Sliced offline; the word lives in the manifest as
    # DATA so games can hide / show / match it. Directory form bundles all files.
    - assets/card_games/everyday/
    # Monochrome emoji font (subset to the ~25 emoji used on printed cards),
    # loaded via rootBundle for the PDF toolkit so verb cards can show 📦 👂 …
    # offline. Helvetica can't draw emoji; this fills only those glyphs (~18 KB).
    # OFL-licensed (NotoEmoji-OFL.txt beside it).
    - assets/fonts/NotoEmoji.ttf

  # Variable display fonts for the Speak feature's editorial karaoke
  # (lib/features/speak/). Bundled (NOT runtime-fetched via google_fonts)
  # so the stage works offline. Each is a single variable TTF — set axes
  # at runtime with `fontVariations` (e.g. FontVariation('wght', 720)).
  # OFL-licensed; license text sits beside each .ttf.
  fonts:
    # Jost — the app's primary typeface (lib/app/design_tokens.dart). A
    # geometric / Futura-style sans; the whole UI ramp is built from it,
    # with the thin-tracked-uppercase treatment carrying the brand voice.
    # Single variable TTF (Thin→Black); set weight via fontWeight.
    - family: Jost
      fonts:
        - asset: assets/fonts/Jost.ttf
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces.ttf
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk.ttf
    # Anton — a static condensed-black display face (single weight) for the
    # bold "statement" Speak modes (Headline / Slam / Marker / Oversized).
    - family: Anton
      fonts:
        - asset: assets/fonts/Anton.ttf

# ── Brand face ──────────────────────────────────────────────────────────────
# The Horizon mark (assets/brand/icon.png, painted by
# tool/render_brand_assets.dart) → real launcher icons + splash across every
# platform, replacing the stock Flutter icon. Brand teal #2A9D8F.
flutter_launcher_icons:
  image_path: "assets/brand/icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  min_sdk_android: 21
  adaptive_icon_background: "#2A9D8F"
  adaptive_icon_foreground: "assets/brand/icon.png"
  web:
    generate: true
    background_color: "#2A9D8F"
    theme_color: "#2A9D8F"
  macos:
    generate: true
  windows:
    generate: true

flutter_native_splash:
  color: "#2A9D8F"
  image: "assets/brand/icon.png"
  android_12:
    color: "#2A9D8F"
    image: "assets/brand/icon.png"
