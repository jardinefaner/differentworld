name: Deploy Flutter web

# Builds the Flutter web target and publishes it to GitHub Pages.
# Triggers on every push to main and is also manually re-runnable via
# the "Run workflow" button.
#
# What ships in the web bundle:
# - Public config (Supabase URL + anon key + PowerSync URL) injected
#   from GitHub Secrets. These are public-by-design per CLAUDE.md —
#   RLS is the real gate. Putting them in Secrets is for hygiene
#   (rotating later = one UI change), not secrecy.
# - NO vendor keys (Deepgram, OpenAI). The omnibox mic + AI features
#   degrade gracefully ("voice not configured" snackbar) when the
#   keys are blank. To enable them on the web build, add
#   DEEPGRAM_API_KEY / OPENAI_API_KEY secrets — but read the
#   `EXTERNAL ROLLOUT` warning in `.env.example` first; vendor keys
#   in a public web bundle are extractable by any visitor.

on:
  push:
    branches: [main]
    # Wave 169 — cost / latency hygiene. Skip the ~2.5-min web build
    # when a push touches ONLY paths that don't change the bundle.
    # Mobile-only changes (android/ios/macos), migrations
    # (server-side only), markdown / docs, scripts, the editor /
    # IDE config files, and gitignore all skip. Anything that
    # touches lib/, web/, pubspec, the workflow itself, or the .env
    # template still triggers a deploy.
    #
    # Manual `workflow_dispatch` still lets us force a build from
    # the Actions tab — useful for re-running after a runner flake
    # or pushing a re-build with no code change.
    paths-ignore:
      - 'android/**'
      - 'ios/**'
      - 'macos/**'
      - 'windows/**'
      - 'linux/**'
      - 'supabase/**'
      - 'docs/**'
      - 'scripts/**'
      - 'test/**'
      - 'integration_test/**'
      - '**/*.md'
      - '.gitignore'
      - '.idea/**'
      - 'fastlane/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Wave 169: was `false` — a stack of 4 pushes meant 4 full builds
  # ran sequentially even though only the last one mattered. With
  # cancel-in-progress, a new push interrupts the in-flight build
  # and we go straight to building HEAD. Pages deploys serialize
  # safely at the GitHub side, so this is purely a build-minutes
  # win.
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # PowerSync needs its web worker + sqlite3.wasm copied into web/.
      # CLAUDE.md: "After every powersync version bump: dart run powersync:setup_web."
      # We re-run on every build to stay safe; idempotent + cheap.
      - name: Setup PowerSync web assets
        run: dart run powersync:setup_web

      # Write .env from secrets. flutter_dotenv reads this at app
      # startup; without it the app boots into the "missing env"
      # error screen.
      #
      # Only public-by-design config goes here. Vendor keys
      # (Deepgram, OpenAI) are deliberately NOT in the web bundle —
      # they go through Supabase Edge Function brokers
      # (`voice-token`, future `ai-chat`) so the master keys never
      # touch a device. See docs/SECRETS.md.
      - name: Write .env
        run: |
          cat > .env <<EOF
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          POWERSYNC_URL=${{ secrets.POWERSYNC_URL }}
          SENTRY_DSN=
          EOF

      # Project-page hosting is at /differentworld/, not the root, so
      # the base href has to match or all asset paths 404.
      - name: Build web
        run: flutter build web --base-href "/differentworld/" --release

      # SPA fallback: GitHub Pages 404s for any unknown path
      # (`/differentworld/schedule` etc), but it WILL serve a
      # `404.html` if present. Make that file a copy of `index.html`
      # so the Flutter shell loads on any path and `go_router`
      # resolves the route client-side. This is the standard
      # GitHub-Pages-hosting-an-SPA trick.
      - name: Copy index.html to 404.html (SPA fallback)
        run: cp build/web/index.html build/web/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
