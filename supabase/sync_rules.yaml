# PowerSync sync rules for Different World — universal-naming version.
# https://docs.powersync.com/sync/streams/overview
#
# Edition 3 (streams). The engine-level table names are:
#   spaces / members / groups / subjects / guardians / subject_guardians
#   / attendance_records / invites
#
# Strategy: one stream for the signed-in member's own row (always synced,
# so the client can read its own member record before any space
# assignment), and one stream for everything scoped to the member's space.

config:
  edition: 3

streams:
  current_member:
    auto_subscribe: true
    query: SELECT * FROM members WHERE id = auth.user_id()

  by_space:
    auto_subscribe: true
    queries:
      - SELECT * FROM spaces             WHERE id        IN (SELECT space_id FROM members WHERE id = auth.user_id())
      - SELECT * FROM members            WHERE space_id  IN (SELECT space_id FROM members WHERE id = auth.user_id())
      - SELECT * FROM groups             WHERE space_id  IN (SELECT space_id FROM members WHERE id = auth.user_id())
      - SELECT * FROM enrollments        WHERE space_id  IN (SELECT space_id FROM members WHERE id = auth.user_id())
      - SELECT * FROM subjects           WHERE space_id  IN (SELECT space_id FROM members WHERE id = auth.user_id())
      - SELECT * FROM guardians          WHERE space_id  IN (SELECT space_id FROM members WHERE id = auth.user_id())
      - SELECT * FROM subject_guardians  WHERE space_id  IN (SELECT space_id FROM members WHERE id = auth.user_id())
      # Long-tail tables — time-windowed to the recent past so cold
      # launch doesn't ship a year of history to every device, per
      # CLAUDE.md "data efficiency / sync scope." Older data lives in
      # an opt-in stream wired only when the user navigates to history
      # (not implemented yet — `by_space` is enough until someone
      # actually scrolls back). Windows chosen so a returning-from-
      # holidays teacher still has context on day one.
      - SELECT * FROM attendance_records WHERE space_id IN (SELECT space_id FROM members WHERE id = auth.user_id()) AND date >= (current_date - INTERVAL '90 days')::text
      - SELECT * FROM group_members      WHERE space_id  IN (SELECT space_id FROM members WHERE id = auth.user_id())
      # Entries (observations / meals / naps / diapers / incidents).
      - SELECT * FROM entries            WHERE space_id IN (SELECT space_id FROM members WHERE id = auth.user_id()) AND recorded_at > now() - INTERVAL '90 days'
      # Fleet: keep the vehicle list full; only the event log is
      # time-windowed (the dashboard only needs recent trips to derive
      # current state — older trips are nice-to-have, not required).
      - SELECT * FROM vehicles           WHERE space_id  IN (SELECT space_id FROM members WHERE id = auth.user_id())
      - SELECT * FROM vehicle_logs       WHERE space_id IN (SELECT space_id FROM members WHERE id = auth.user_id()) AND created_at > now() - INTERVAL '60 days'
      # Certifications — director needs the whole space's certs for
      # "expiring soon" dashboards; teachers see all but UI gates edits.
      # Full scope here (low row count, long-lived data).
      - SELECT * FROM member_certifications WHERE space_id IN (SELECT space_id FROM members WHERE id = auth.user_id())
      # Attachments — photos / PDFs / audio attached to any entity.
      # Split: entry-attached attachments follow the 90-day entries
      # window (same shape, no orphaned thumbnails); everything else
      # (subject avatar, member avatar, vehicle photo, cert document)
      # stays full because those are infrequent + the UI always wants
      # them ready.
      - SELECT * FROM attachments        WHERE space_id IN (SELECT space_id FROM members WHERE id = auth.user_id()) AND (entity_kind <> 'entry' OR created_at > now() - INTERVAL '90 days')
      # Only stream un-accepted invites. Accepted ones don't need to
      # round-trip back to every director's device — they just bloat
      # the local table over time. The acceptance event itself reaches
      # the director by the members row being updated.
      - SELECT * FROM invites            WHERE space_id  IN (SELECT space_id FROM members WHERE id = auth.user_id()) AND accepted_at IS NULL
