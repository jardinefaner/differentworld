# PowerSync sync rules for Different World — universal-naming version.
# https://docs.powersync.com/sync/streams/overview
#
# Edition 3 (streams). The engine-level table names are:
#   spaces / members / groups / subjects / guardians / subject_guardians
#   / attendance_records / invites
#
# Strategy: one stream for the signed-in member's own row (always synced,
# so the client can read its own member record before any space
# assignment), and one stream for everything scoped to the member's space.

config:
  edition: 3

streams:
  current_member:
    auto_subscribe: true
    query: SELECT * FROM members WHERE id = auth.user_id()

  # Guardian-facing data. Guardians have a `members` row with
  # `space_id = null` (the `handle_new_user` trigger creates the row
  # before they accept any family invite), so the `by_space` queries
  # below evaluate to `IN (NULL)` for them and deliver no rows. This
  # stream is the family-side counterpart — keyed on
  # `guardians.user_id = auth.user_id()` so guardian devices get the
  # data their screens read from Drift.
  #
  # Scope is intentionally NARROW: rows keyed DIRECTLY on a single
  # guardian id, which fit PowerSync's single-level-subquery shape
  # (the same shape `by_space` already uses).
  #
  # Per-subject tables (subjects, attendance_records, entries,
  # attachments) need a 2-level subquery (subject_id → subject_guardians
  # → guardian → user_id) which PowerSync's SQL subset may or may not
  # accept; until we settle that, the family-side providers fetch those
  # rows via direct PostgREST (see `lib/features/family/family_providers.dart`).
  by_guardian:
    auto_subscribe: true
    queries:
      # The guardian's own row — drives `currentGuardianProvider` and
      # the `GuardianViewer` resolution in `viewerProvider`.
      - SELECT * FROM guardians WHERE user_id = auth.user_id()
      # The guardian's space — drives `currentSpaceProvider` (which
      # falls back to `guardian.space_id` when no member row carries it).
      - SELECT * FROM spaces WHERE id IN (SELECT space_id FROM guardians WHERE user_id = auth.user_id())
      # Subject ↔ guardian links — drives the per-child fan-out. The
      # subjects themselves aren't synced here (per-subject 2-level
      # filter, deferred); family screens fetch them via PostgREST.
      - SELECT * FROM subject_guardians WHERE guardian_id IN (SELECT id FROM guardians WHERE user_id = auth.user_id())
      # Messages — staff↔guardian threads. Each row carries the
      # guardian_id directly, so the same single-level pattern works.
      # Replaces the RLS-only gate noted in the messages.sql header.
      - SELECT * FROM messages WHERE guardian_id IN (SELECT id FROM guardians WHERE user_id = auth.user_id())
      # Export recipient rows — drives the staff-side "Seen by …"
      # tracker on a guardian's device. The parent `exports` row is
      # fetched via PostgREST in `myReceivedExportsProvider` because
      # it needs a 2-level filter (export.id ← export_recipients.guardian_id).
      - SELECT * FROM export_recipients WHERE guardian_id IN (SELECT id FROM guardians WHERE user_id = auth.user_id())

  # Global content bank — AI-generated (and future global-curated) activity
  # content, shared across EVERY program (docs/CONTENT_BANK.md). Keyed on
  # `space_id IS NULL` so it reaches all devices — the same generate-once-
  # for-everyone principle the feature is built on. Single-table, no
  # subquery: well within the PowerSync SQL subset. The per-space (crowd)
  # rows come through `by_space` instead.
  global_content:
    auto_subscribe: true
    query: SELECT * FROM content_items WHERE space_id IS NULL

  by_space:
    auto_subscribe: true
    queries:
      - SELECT * FROM spaces             WHERE id        IN (SELECT space_id FROM members WHERE id = auth.user_id())
      - SELECT * FROM members            WHERE space_id  IN (SELECT space_id FROM members WHERE id = auth.user_id())
      - SELECT * FROM groups             WHERE space_id  IN (SELECT space_id FROM members WHERE id = auth.user_id())
      - SELECT * FROM enrollments        WHERE space_id  IN (SELECT space_id FROM members WHERE id = auth.user_id())
      - SELECT * FROM subjects           WHERE space_id  IN (SELECT space_id FROM members WHERE id = auth.user_id())
      - SELECT * FROM guardians          WHERE space_id  IN (SELECT space_id FROM members WHERE id = auth.user_id())
      - SELECT * FROM subject_guardians  WHERE space_id  IN (SELECT space_id FROM members WHERE id = auth.user_id())
      # NOTE: PowerSync sync rules run in a very tight SQL subset —
      # no `date()`, `datetime()`, `now()`, `current_date`, or
      # `INTERVAL`. The supported time-window pattern is a client-
      # supplied parameter (`request.parameters.cutoff_at`) that the
      # device computes + passes via PowerSyncCredentials and refreshes
      # on day-rollover. We'll wire that when row counts justify it
      # (entries / attendance_records grow linearly and will be the
      # first to need it). Until then: space-scoped full sync.
      - SELECT * FROM attendance_records WHERE space_id IN (SELECT space_id FROM members WHERE id = auth.user_id())
      - SELECT * FROM group_members      WHERE space_id IN (SELECT space_id FROM members WHERE id = auth.user_id())
      - SELECT * FROM entries            WHERE space_id IN (SELECT space_id FROM members WHERE id = auth.user_id())
      - SELECT * FROM vehicles           WHERE space_id IN (SELECT space_id FROM members WHERE id = auth.user_id())
      - SELECT * FROM vehicle_logs       WHERE space_id IN (SELECT space_id FROM members WHERE id = auth.user_id())
      - SELECT * FROM member_certifications WHERE space_id IN (SELECT space_id FROM members WHERE id = auth.user_id())
      - SELECT * FROM attachments        WHERE space_id IN (SELECT space_id FROM members WHERE id = auth.user_id())
      # Surveys — one row per (subject, template). Full scope; one
      # year of TK–3rd kid responses for a whole program is well under
      # the noise of any other table.
      - SELECT * FROM survey_responses   WHERE space_id IN (SELECT space_id FROM members WHERE id = auth.user_id())
      # Wave 135: per-program catalog of survey identity-picker
      # options (age band / grade / school). Tiny table — at most a
      # few dozen rows per program over the life of the surveys
      # feature.
      - SELECT * FROM survey_picker_options WHERE space_id IN (SELECT space_id FROM members WHERE id = auth.user_id())
      # Dismissed insights — per-member snooze rows. Tiny table
      # (one row per insight a member has chosen to mute).
      - SELECT * FROM dismissed_insights WHERE space_id IN (SELECT space_id FROM members WHERE id = auth.user_id())
      # Capture inbox — quick "I noticed…" notes awaiting triage. The
      # upward loop's input side. Stays small (most captures get
      # promoted to entries or discarded within a week).
      - SELECT * FROM captures           WHERE space_id IN (SELECT space_id FROM members WHERE id = auth.user_id())
      # Tasks — the third capture-promotion destination. Small unless
      # a program runs hundreds of unclosed action items, which would
      # be a process problem, not a sync problem.
      - SELECT * FROM tasks              WHERE space_id IN (SELECT space_id FROM members WHERE id = auth.user_id())
      # Messages — staff↔guardian threads keyed on (subject, guardian).
      # Each thread is a back-and-forth about one kid. Staff side
      # syncs all messages in the space; guardians only see threads
      # they're on (enforced by RLS, not sync rule — the per-row
      # filter would need joins this SQL subset doesn't support).
      - SELECT * FROM messages           WHERE space_id IN (SELECT space_id FROM members WHERE id = auth.user_id())
      # Exports — audit + snapshot of every PDF / CSV the director
      # has generated. The rendered bytes live in Storage; this
      # table just carries the metadata + the source-data snapshot.
      - SELECT * FROM exports            WHERE space_id IN (SELECT space_id FROM members WHERE id = auth.user_id())
      - SELECT * FROM export_recipients  WHERE space_id IN (SELECT space_id FROM members WHERE id = auth.user_id())
      # Only stream un-accepted invites. Accepted ones don't need to
      # round-trip back to every director's device — they just bloat
      # the local table over time. The acceptance event itself reaches
      # the director by the members row being updated.
      - SELECT * FROM invites            WHERE space_id  IN (SELECT space_id FROM members WHERE id = auth.user_id()) AND accepted_at IS NULL
      # Camp scheduling — locations, activities, schedule_blocks per
      # day, plus the field-trip side tables. Volume is bounded by
      # (cohorts × blocks_per_day × days) — a 90-kid camp with 5 rooms
      # and 8 blocks/day produces ~40 schedule_blocks/day. The full
      # season fits comfortably in a space-scoped full sync; we'll
      # add a date-window parameter once it actually matters.
      # Supplies — the program's inventory catalog (docs/SUPPLIES.md).
      - SELECT * FROM supplies           WHERE space_id IN (SELECT space_id FROM members WHERE id = auth.user_id())
      # Missions — real jobs a kid does, with evidence (docs/MISSIONS.md).
      - SELECT * FROM missions           WHERE space_id IN (SELECT space_id FROM members WHERE id = auth.user_id())
      # Activity supplies — the pack-list join (docs/SUPPLIES.md).
      - SELECT * FROM activity_supplies  WHERE space_id IN (SELECT space_id FROM members WHERE id = auth.user_id())
      - SELECT * FROM locations          WHERE space_id IN (SELECT space_id FROM members WHERE id = auth.user_id())
      - SELECT * FROM activities         WHERE space_id IN (SELECT space_id FROM members WHERE id = auth.user_id())
      - SELECT * FROM schedule_blocks    WHERE space_id IN (SELECT space_id FROM members WHERE id = auth.user_id())
      - SELECT * FROM trip_logistics     WHERE space_id IN (SELECT space_id FROM members WHERE id = auth.user_id())
      - SELECT * FROM trip_vehicles      WHERE space_id IN (SELECT space_id FROM members WHERE id = auth.user_id())
      - SELECT * FROM permission_slips   WHERE space_id IN (SELECT space_id FROM members WHERE id = auth.user_id())
      - SELECT * FROM headcounts         WHERE space_id IN (SELECT space_id FROM members WHERE id = auth.user_id())
      # Wave 158: one-off events overlaying the regular schedule.
      - SELECT * FROM events             WHERE space_id IN (SELECT space_id FROM members WHERE id = auth.user_id())
      # Wave 154: weekly template — director's default recurring
      # pattern per cohort × day-of-week. Generator reads these +
      # writes schedule_blocks for a date range.
      - SELECT * FROM weekly_templates       WHERE space_id IN (SELECT space_id FROM members WHERE id = auth.user_id())
      - SELECT * FROM weekly_template_blocks WHERE space_id IN (SELECT space_id FROM members WHERE id = auth.user_id())
      # Content bank — the program's OWN (crowd-grown) banked activity
      # content (docs/CONTENT_BANK.md). Global AI/curated content
      # (space_id IS NULL) arrives via the separate `global_content`
      # stream (declared above), NOT here.
      - SELECT * FROM content_items          WHERE space_id IN (SELECT space_id FROM members WHERE id = auth.user_id())
      # Different World — the persistent in-world self (drawn avatar +
      # chosen name), 1:1 with a subject. One row per enrolled child;
      # tiny. See docs/WORLD.md + supabase/migrations/20260606000001.
      - SELECT * FROM character_sheets       WHERE space_id IN (SELECT space_id FROM members WHERE id = auth.user_id())
      # The Room console (docs/ROTATION.md). rotation_rounds is the pair
      # history — who sat with whom, per cohort; room_events is the ONE
      # fairness log every instrument writes to (picked / spoke / points /
      # prompt used). STAFF ONLY: a round names which children were grouped
      # together, so neither table may ever join the by_guardian stream.
      - SELECT * FROM rotation_rounds        WHERE space_id IN (SELECT space_id FROM members WHERE id = auth.user_id())
      - SELECT * FROM room_events            WHERE space_id IN (SELECT space_id FROM members WHERE id = auth.user_id())
      # Year rollover (docs/ROLLOVER.md). `terms` are the named periods;
      # `placements` are child-in-room-for-a-period — the history that makes
      # a new intake ADDITIVE instead of a delete. NOT `enrollments`, which
      # has meant staff↔classroom since the foundation migration (above).
      # Staff-only: a placement names which child sat in which room.
      - SELECT * FROM terms                  WHERE space_id IN (SELECT space_id FROM members WHERE id = auth.user_id())
      - SELECT * FROM placements             WHERE space_id IN (SELECT space_id FROM members WHERE id = auth.user_id())
